[package]
name = "kuberve-libc"
version = "0.14.4"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Kuberve/libc"
authors = ["Simonov Zakhar <zaharsimonov6087@gmail.com> (BlackZakha)"]
description = "Kuberve userspace library — syscall wrappers, heap allocator, UART"
readme = "README.md"

[lib]
name = "kuberve_libc"
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
kuberve-abi = { git = "https://github.com/Kuberve/abi" }

[lints.rust]
static_mut_refs = "allow"
dead_code = "allow"